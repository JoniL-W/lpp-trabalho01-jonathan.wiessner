<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cacau Dourado</title><style>
body{margin:0;background:#201715;color:#f8ead7;font-family:system-ui}#app{max-width:1060px;margin:20px auto;padding:0 12px}.card{background:#30231f;border:1px solid #5d4439;border-radius:15px;padding:14px;margin:10px 0}input,button{font:inherit;padding:10px;border-radius:9px}input{width:100%;box-sizing:border-box;margin:8px 0;background:#18110f;border:1px solid #6d5145;color:#fff}button{border:0;font-weight:700;margin-right:8px;background:#d2a154;cursor:pointer}#jogo{overflow:hidden;border-radius:12px}#jogo canvas{width:100%!important;height:auto!important;display:block}.eventos{font:12px ui-monospace,monospace}.evento{border-left:4px solid #68a36c;background:#211815;padding:7px;margin:5px 0}
</style></head><body><div id="app"><section v-if="!conectado" class="card"><h1>🍫 Cacau Dourado</h1><p>Etapa 3: personagem controlável e multiplayer visível.</p><input v-model="nome" placeholder="Seu nome"><button @click="entrar('mestre')">👑 Mestre</button><button @click="entrar('jogador')">🍫 Jogador</button></section><main v-else><h1>🍫 Vila da Chocolateria</h1><p>Use <strong>WASD ou setas</strong>. Abra outra aba para ver o outro personagem andando.</p><section class="card"><div id="jogo"></div></section><section class="card eventos"><h2>📡 Painel</h2><div v-for="e in eventos" class="evento">⬇ on <strong>{{e.nome}}</strong> · causa: {{e.causa}}<br>↪ {{e.reacao}}</div></section></main></div>
<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.js"></script><script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>
function criarJogo(h){let game,scene;class S extends Phaser.Scene{constructor(){super('v')}create(){this.av={};this.me=null;this.last=0;const g=this.add.graphics();g.fillStyle(0x87b96d).fillRect(0,0,960,540);g.fillStyle(0xd8b57f).fillRoundedRect(50,290,860,60,25);g.fillRoundedRect(450,75,60,400,25);for(const [x,y,t] of [[210,150,'🔥 Torrefação'],[470,135,'⚙️ Moagem'],[700,155,'🍫 Moldagem'],[830,400,'🛒 Vitrine'],[120,410,'🏛️ Prefeitura']]){g.fillStyle(0x70432f).fillRoundedRect(x-42,y-28,84,60,7);g.fillStyle(0x4b2a20).fillTriangle(x-52,y-28,x+52,y-28,x,y-67);this.add.text(x,y-83,t,{fontSize:'14px',color:'#fff',backgroundColor:'#2b211dcc',padding:{x:5,y:3}}).setOrigin(.5)}this.keys=this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT');scene=this}
avatar(sid,j){if(this.av[sid])return this.av[sid];const c=this.add.container(j.x,j.y).setDepth(20);const sh=this.add.ellipse(0,16,24,9,0x000000,.2),body=this.add.rectangle(0,2,18,25,j.papel==='mestre'?0xe0b14f:0x8b5135).setStrokeStyle(2,0x3a241c),head=this.add.circle(0,-14,9,0xf0c8a0).setStrokeStyle(2,0x3a241c),name=this.add.text(0,29,j.nome,{fontSize:'11px',color:'#fff',backgroundColor:'#2b211dcc',padding:{x:4,y:2}}).setOrigin(.5),mark=this.add.text(0,-37,j.papel==='mestre'?'👑':'🍫',{fontSize:'14px'}).setOrigin(.5);c.add([sh,body,head,mark,name]);this.av[sid]=c;return c}
sync(me,jogs){this.me=me;Object.entries(jogs).forEach(([sid,j])=>{const c=this.avatar(sid,j);c.setPosition(j.x,j.y)})}entrou(sid,j){this.avatar(sid,j)}saiu(sid){if(this.av[sid]){this.av[sid].destroy();delete this.av[sid]}}remoto(sid,x,y){if(this.av[sid]&&sid!==this.me)this.tweens.add({targets:this.av[sid],x,y,duration:90})}
update(t){const c=this.av[this.me];if(!c)return;let dx=0,dy=0,k=this.keys;if(k.A.isDown||k.LEFT.isDown)dx--;if(k.D.isDown||k.RIGHT.isDown)dx++;if(k.W.isDown||k.UP.isDown)dy--;if(k.S.isDown||k.DOWN.isDown)dy++;if(dx||dy){const l=Math.hypot(dx,dy);c.x=Phaser.Math.Clamp(c.x+dx/l*2.7,28,932);c.y=Phaser.Math.Clamp(c.y+dy/l*2.7,68,510);if(t-this.last>80){this.last=t;h.move(c.x,c.y)}}}}
return{start(id){game=new Phaser.Game({type:Phaser.AUTO,parent:id,width:960,height:540,scene:S,audio:{noAudio:true}})},sync:(...a)=>scene&&scene.sync(...a),entrou:(...a)=>scene&&scene.entrou(...a),saiu:(...a)=>scene&&scene.saiu(...a),remoto:(...a)=>scene&&scene.remoto(...a)}}
const{createApp,ref,nextTick}=Vue;createApp({setup(){const nome=ref(''),conectado=ref(false),eventos=ref([]);let socket;const jogo=criarJogo({move:(x,y)=>socket&&socket.emit('jogador.movimentou',{x,y})});function add(n,d,r){eventos.value.unshift({nome:n,causa:d.causa,reacao:r});eventos.value=eventos.value.slice(0,20)}function entrar(p){socket=io({auth:{nome:nome.value||'Anônimo',papel:p}});socket.on('connect',()=>{conectado.value=true;nextTick(()=>jogo.start('jogo'))});socket.on('estado.sincronizado',d=>{add('estado.sincronizado',d,'desenha todos os jogadores');setTimeout(()=>jogo.sync(d.meu_sid,d.jogadores),50)});socket.on('jogador.entrou',d=>{add('jogador.entrou',d,'desenha o novo personagem');jogo.entrou(d.sid,d.jogador)});socket.on('jogador.saiu',d=>{add('jogador.saiu',d,'remove o personagem');jogo.saiu(d.sid)});socket.on('jogador.posicao_atualizada',d=>jogo.remoto(d.sid,d.x,d.y))}return{nome,conectado,eventos,entrar}}}).mount('#app');
</script></body></html>
